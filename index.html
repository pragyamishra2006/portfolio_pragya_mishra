    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Pragya Mishra",
        "jobTitle": "Computer Science Engineering Student & Aspiring Software Engineer",

        "address": {

          "addressLocality": "Kanpur",

        },

    <!-- Prevent theme flash on load -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pragya-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-zinc-50 text-zinc-900 dark:bg-[#09090B] dark:text-zinc-100 antialiased selection:bg-blue-600/20 selection:text-blue-600 dark:selection:bg-blue-500/30 dark:selection:text-blue-300">
